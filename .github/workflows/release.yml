name: Release
on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  publish:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Exact Node pin: its bundled npm (11.19.0) is what publishes, no npm@latest
      # download inside a job that holds id-token: write
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm

      - name: Check npm supports trusted publishing
        run: |
          npm --version
          node -e '
            const [maj, min, pat] = process.argv[1].split(".").map(Number)
            const ok = maj > 11 || (maj === 11 && (min > 5 || (min === 5 && pat >= 1)))
            if (!ok) { console.error("npm " + process.argv[1] + " is older than 11.5.1, the trusted publishing minimum"); process.exit(1) }
          ' "$(npm --version)"

      - name: Check the tag matches both versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          EXT="v$(node -p "require('./extension/manifest.json').version")"
          if [ "$TAG" != "$PKG" ] || [ "$TAG" != "$EXT" ]; then
            echo "::error::tag $TAG does not match package.json ($PKG) and extension/manifest.json ($EXT)"
            exit 1
          fi

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run coverage

      - name: Build
        run: npm run build

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: E2E
        run: npm run e2e

      - name: Check if version is already published
        id: check
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          if npm view "$NAME@$VERSION" version > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # Tokenless: this workflow is registered on npmjs.com as the package's
      # trusted publisher, so npm authenticates over GitHub OIDC (id-token above).
      # Never add NODE_AUTH_TOKEN here: with a token present npm skips OIDC.
      # No `environment:` on this job: the npm-side trusted publisher was set up
      # with no environment, and npm's docs do not state that such a config
      # accepts a token carrying an environment claim. Add one only together
      # with the matching npm-side setting.
      - name: Publish
        if: steps.check.outputs.published == 'false'
        # verbose: a failed OIDC token exchange only says why at this level
        env:
          NPM_CONFIG_LOGLEVEL: verbose
        run: npm publish --provenance

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.21.0
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Create the GitHub Release with the changelog section and the extension zip
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            echo "release $TAG already exists"
            exit 0
          fi
          VERSION="${TAG#v}"
          awk -v v="$VERSION" '
            index($0, "## [" v "]") == 1 { on = 1; next }
            on && /^## \[/ { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            echo "::error::CHANGELOG.md has no ## [$VERSION] section"
            exit 1
          fi
          ZIP="herdr-picker-$VERSION-extension.zip"
          (cd dist/extension && zip -qr "../../$ZIP" .)
          gh release create "$TAG" "$ZIP" --repo "$REPO" --title "$TAG" --notes-file notes.md --verify-tag
